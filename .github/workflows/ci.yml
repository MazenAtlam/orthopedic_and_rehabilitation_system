name: HCIS contribution CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contribution:
    name: CI gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contributions/amr/hcis
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hcis_ci
          POSTGRES_PASSWORD: hcis_ci
          POSTGRES_DB: hcis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcis_ci -d hcis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORTHO_TEST_DATABASE_URL: postgresql+psycopg://hcis_ci:hcis_ci@localhost:5432/hcis_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contributions/amr/hcis/requirements*.txt
      - name: Check the billing, database, and FHIR application
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contributions/amr/hcis/emr-client/package-lock.json
      - name: Check the EMR client
        working-directory: contributions/amr/hcis/emr-client
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build
