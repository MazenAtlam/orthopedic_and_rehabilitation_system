# CI for Team 03 - enforces the Phase 0 code style and runs the tests.
# Each job runs ONLY when files in its own area changed (see the "changes" job).
# A change that touches only README.md or docs/ runs no code job.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------ Detect changed areas
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      cdss: ${{ steps.filter.outputs.cdss }}
      docker: ${{ steps.filter.outputs.docker }}
      web: ${{ steps.matrix.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            cdss:
              - 'cdss-service/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            emr_client:
              - 'emr-client/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker-compose.yml'
              - '.env.example'
              - 'nginx/**'
              - 'backend/**'
              - 'frontend/**'
              - 'emr-client/**'
              - '.github/workflows/ci.yml'
      - name: Build the list of React apps to check
        id: matrix
        run: |
          apps=""
          if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then apps="\"frontend\""; fi
          if [ "${{ steps.filter.outputs.emr_client }}" = "true" ]; then
            if [ -n "$apps" ]; then apps="$apps,"; fi
            apps="$apps\"emr-client\""
          fi
          echo "web=[$apps]" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------ Backend (Python)
  backend:
    name: Backend - black, flake8, mypy, pytest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hcis_user
          POSTGRES_PASSWORD: hcis_password
          POSTGRES_DB: hcis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcis_user -d hcis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      DATABASE_URL: postgresql+psycopg2://hcis_user:hcis_password@localhost:5432/hcis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: black (format check)
        run: black --check .
      - name: flake8 (lint)
        run: flake8 .
      - name: mypy (types)
        run: mypy app
      - name: pytest
        run: pytest --cov=app --cov-report=term-missing

  # ------------------------------------------------------------ CDSS service (Python)
  cdss-service:
    name: CDSS - black, flake8, mypy, pytest
    needs: changes
    if: needs.changes.outputs.cdss == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdss-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cdss-service/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: black (format check)
        run: black --check .
      - name: flake8 (lint)
        run: flake8 .
      - name: mypy (types)
        run: mypy app
      - name: pytest (exit code 5 = no tests yet, allowed)
        run: pytest || [ $? -eq 5 ]

  # ------------------------------------------------------------ React apps
  web:
    name: ${{ matrix.app }} - prettier, eslint, tests, build
    needs: changes
    if: needs.changes.outputs.web != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.web) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # TODO: add "cache: npm" and "cache-dependency-path" after package-lock.json is committed
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # The next three steps are skipped while the script does not exist (--if-present).
      # Anas / Amr: add these scripts to package.json -> "format:check", "lint", "test".
      - name: Prettier (format check)
        run: npm run format:check --if-present
      - name: ESLint (Airbnb)
        run: npm run lint --if-present
      - name: Tests (Jest)
        run: npm test --if-present
      - name: Build
        run: npm run build

  # ------------------------------------------------------------ Docker
  docker:
    name: Docker Compose build and smoke test
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build and start all Phase 2 services
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health check through Nginx
        run: curl --fail --silent --show-error http://localhost/api/v1/health
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------ Single required check
  # Make ONLY this job a required status check in the branch protection rule.
  # It passes when every job that ran passed, and when jobs were skipped (no changes).
  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, commit-messages, backend, cdss-service, web, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "At least one CI job failed or was cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."