# Single entry point for the browser (Phase 1, Section 3.1).
# Development uses plain HTTP on port 80. Enable TLS (HTTPS) for the final demo.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Re-resolve Docker container IPs dynamically when backend/frontend recreate
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Large limit so DICOM uploads work in Phase 3
    client_max_body_size 200m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API (Flask)
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React web application (Vite dev server, needs WebSocket for hot reload)
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
