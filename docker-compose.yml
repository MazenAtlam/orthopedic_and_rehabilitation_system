# Orthopedic and Rehabilitation System - Team 03
#
#   Phase 2 stack (default):  docker compose up --build
#   Phase 3 stack (imaging):  docker compose --profile imaging up --build
#
# All values come from the ".env" file (copy ".env.example" first).

name: orthopedic-rehab-system

services:
  # ---------------------------------------------------------------- Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------- Backend (Flask API)
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Development server with auto-reload. Remove this line to use gunicorn (Dockerfile default).
    command: ["flask", "--app", "wsgi", "run", "--debug", "--host", "0.0.0.0", "--port", "5000"]
    volumes:
      - ./backend:/app
      - ./database/seed:/database_seed
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------- Web app (React)
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/v1}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ------------------------------------------------- EMR client (FHIR client)
  emr-client:
    build:
      context: ./emr-client
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ./emr-client:/app
      - emr_node_modules:/app/node_modules
    ports:
      - "5174:5174"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5174/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # -------------------------------------------- Nginx (single entry point)
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ======================= Phase 3 only (profile "imaging") =================
  # Placeholders. Ahmed (Orthanc/OHIF) and Mazen (CDSS) finish the settings in Phase 3.
  orthanc:
    profiles: ["imaging"]
    image: orthancteam/orthanc:latest   # TODO Phase 3: pin an exact version
    restart: unless-stopped
    environment:
      ORTHANC__NAME: "HCIS Orthanc"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USER:-orthanc}": "${ORTHANC_PASSWORD:-orthanc}"}'
      DICOM_WEB_PLUGIN_ENABLED: "true"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    ports:
      - "8042:8042"   # HTTP / DICOMweb
      - "4242:4242"   # DICOM protocol

  cdss-service:
    profiles: ["imaging"]
    build:
      context: ./cdss-service
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./cdss-service:/app
    ports:
      - "8000:8000"
    depends_on:
      - orthanc

volumes:
  pgdata:
  orthanc_data:
  frontend_node_modules:
  emr_node_modules:
